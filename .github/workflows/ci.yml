name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  check:
    name: Tests & static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # Runs phpunit + phpstan — the same `composer check` used locally.
      - name: composer check
        run: composer check
