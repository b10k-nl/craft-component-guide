name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  # Weekly, against the newest Craft and MCP SDK: there is no composer.lock,
  # so a Craft release that no longer fits (the MCP attributes, the content-model
  # check interface) turns this red before a client site meets it.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  check:
    name: Tests & static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # Runs phpunit + phpstan — the same `composer check` used locally.
      - name: composer check
        run: composer check

  js:
    name: Control panel JS tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # jsdom + node:test — the same `npm test` used locally.
      - name: npm test
        run: npm test
